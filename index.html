    <title>Segredo da Insulina — Quiz</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K2EMQ5T4YE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K2EMQ5T4YE');
    </script>
    <script>
      // Pixel Google da Utmify: o script da Utmify aceita um pixel por pagina,
      // entao escolhemos a conta do Google Ads assim:
      // 1) etiqueta "acc" no link (o sufixo dos anuncios da Silva termina com &acc=silva);
      // 2) senao, o ID da campanha (utm_campaign) na lista SILVA_CAMPAIGNS (anuncios antigos, sem a etiqueta);
      // 3) senao, a conta Fabricio.
      (function () {
        var PIXEL_FABRICIO = '6ae886d0d5539a935c80266b';
        var PIXEL_SILVA = '6aea0e4533b3ca05157e641d';
        var SILVA_CAMPAIGNS = ['24438334036', '24432493115', '24429973604'];
        var CHOICE_KEY = 'utmify_google_pixel_id';
        var UTMIFY_LEAD_KEY = 'lead-google';

        var params = null;
        try { params = new URLSearchParams(window.location.search); } catch (e) {}
        var acc = params ? (params.get('acc') || '').toLowerCase() : '';
        var campaign = params ? params.get('utm_campaign') : null;

        var pixelId = null;
        if (acc === 'silva') {
          pixelId = PIXEL_SILVA;
        } else if (acc === 'fabricio') {
          pixelId = PIXEL_FABRICIO;
        } else if (campaign) {
          pixelId = SILVA_CAMPAIGNS.indexOf(campaign) !== -1 ? PIXEL_SILVA : PIXEL_FABRICIO;
        } else {
          try { pixelId = localStorage.getItem(CHOICE_KEY); } catch (e) {}
        }
        if (pixelId !== PIXEL_SILVA && pixelId !== PIXEL_FABRICIO) pixelId = PIXEL_FABRICIO;

        try {
          localStorage.setItem(CHOICE_KEY, pixelId);
          // A Utmify guarda o visitante junto com o pixel; se a conta mudou, comeca do zero.
          var lead = JSON.parse(localStorage.getItem(UTMIFY_LEAD_KEY) || 'null');
          if (lead && lead.pixelId && lead.pixelId !== pixelId) localStorage.removeItem(UTMIFY_LEAD_KEY);
        } catch (e) {}

        window.googlePixelId = pixelId;
        var s = document.createElement('script');
        s.src = 'https://cdn.utmify.com.br/scripts/pixel/pixel-google.js';
        s.async = true;
        s.defer = true;
        (document.head || document.documentElement).appendChild(s);
      })();
    </script>
    <script>
      // Eventos do funil no GA4 (mesmos nomes de antes: etapa_00 ... etapa_28).
      // O codigo do quiz chama window.__quizEvent(tipo, pagina) a cada tela; pagina 1 = capa, 28 = oferta.
      (function () {
        var NAMES = ['pagina_inicial', 'idade', 'corpo', 'area_do_corpo', 'nao_esta_sozinha', 'materia_globo', 'nome', 'o_que_incomoda', 'ja_tentou_emagrecer', 'corpo_resiste', 'o_que_impede', 'comparacao_metodos', 'objetivos', 'inchaco', 'como_funciona', 'peso_atual', 'altura', 'peso_desejado', 'rotina', 'sono', 'previsao_resultado', 'compromisso', 'primeiro_resultado', 'terminou_quiz', 'resultado_analise', 'depoimentos', 'gerando_plano', 'chegou_na_oferta'];
        var PRICE = 39.90;
        var sent = {};
        function send(name, params) {
          if (sent[name] || typeof window.gtag !== 'function') return;
          sent[name] = true;
          window.gtag('event', name, params || {});
        }
        function etapa(n, label) { return ('etapa_' + (n < 10 ? '0' : '') + n + '_' + label).slice(0, 40); }
        window.__quizEvent = function (type, page) {
          if (type === 'page_view' && page >= 1 && page <= NAMES.length) {
            var n = page - 1;
            send(etapa(n, NAMES[n]), n === 27 ? { currency: 'BRL', value: PRICE } : { step_number: n });
          } else if (type === 'checkout_click') {
            send(etapa(28, 'clicou_no_checkout'), { currency: 'BRL', value: PRICE, transport_type: 'beacon' });
            send('begin_checkout', { currency: 'BRL', value: PRICE, transport_type: 'beacon' });
          }
        };
      })();
    </script>

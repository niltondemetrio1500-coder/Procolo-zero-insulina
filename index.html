    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K2EMQ5T4YE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K2EMQ5T4YE');
    </script>
    <script>
      // Pixel Google da Utmify (mesmo codigo enviado pela Utmify, em versao legivel).
      // A Utmify so aceita um pixel por visita, entao o pixel e escolhido pelo link do anuncio:
      // link com conta=2 -> pixel da conta nova; sem parametro -> pixel da conta Bruna.
      (function () {
        var PIXELS = {
          '1': '6b043c5429d2ebc66e8f249a', // conta Bruna (23/11), padrao
          '2': '6b044b40d11b297462430258'  // conta nova (23/11), anuncios com conta=2
        };
        var conta = '1';
        try {
          var params = new URLSearchParams(window.location.search);
          var q = params.get('conta');
          if (q && PIXELS[q]) { conta = q; localStorage.setItem('utmify_conta', q); }
          // clique novo em anuncio sem conta=2 volta para a conta Bruna
          else if (params.get('gclid') || params.get('utm_source')) localStorage.setItem('utmify_conta', '1');
          else if (PIXELS[localStorage.getItem('utmify_conta')]) conta = localStorage.getItem('utmify_conta');
        } catch (e) {}
        var pixelId = PIXELS[conta];
        try {
          // A Utmify guarda o visitante junto com o pixel; se o pixel mudou, comeca do zero.
          var lead = JSON.parse(localStorage.getItem('lead-google') || 'null');
          if (lead && lead.pixelId && lead.pixelId !== pixelId) localStorage.removeItem('lead-google');
          localStorage.removeItem('utmify_google_pixel_id');
        } catch (e) {}
        window.googlePixelId = pixelId;
        var s = document.createElement('script');
        s.src = 'https://cdn.utmify.com.br/scripts/pixel/pixel-google.js';
        s.async = true;
        s.defer = true;
        (document.head || document.documentElement).appendChild(s);
      })();
    </script>
    <!-- Script de UTMs da Utmify: leva o clique do anuncio (gclid) junto com as UTMs ate o checkout da Greenn,
         para a Utmify conseguir marcar a compra no Google Ads. -->
    <script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>
    <script>
      // Eventos do funil no GA4 (mesmos nomes de antes: etapa_00 ... etapa_28).
      // O codigo do quiz chama window.__quizEvent(tipo, pagina) a cada tela; pagina 1 = capa, 28 = oferta.
      (function () {
        var NAMES = ['pagina_inicial', 'idade', 'corpo', 'area_do_corpo', 'nao_esta_sozinha', 'materia_globo', 'nome', 'o_que_incomoda', 'ja_tentou_emagrecer', 'corpo_resiste', 'o_que_impede', 'comparacao_metodos', 'objetivos', 'inchaco', 'como_funciona', 'peso_atual', 'altura', 'peso_desejado', 'rotina', 'sono', 'previsao_resultado', 'compromisso', 'primeiro_resultado', 'terminou_quiz', 'resultado_analise', 'depoimentos', 'gerando_plano', 'chegou_na_oferta'];
        var PRICE = 40.00;
        var sent = {};
        function send(name, params) {
          if (sent[name] || typeof window.gtag !== 'function') return;
          sent[name] = true;
          window.gtag('event', name, params || {});
        }
        function etapa(n, label) { return ('etapa_' + (n < 10 ? '0' : '') + n + '_' + label).slice(0, 40); }
        window.__quizEvent = function (type, page) {
          if (type === 'page_view' && page >= 1 && page <= NAMES.length) {
            var n = page - 1;
            send(etapa(n, NAMES[n]), n === 27 ? { currency: 'BRL', value: PRICE } : { step_number: n });
          } else if (type === 'checkout_click') {
            send(etapa(28, 'clicou_no_checkout'), { currency: 'BRL', value: PRICE, transport_type: 'beacon' });
            send('begin_checkout', { currency: 'BRL', value: PRICE, transport_type: 'beacon' });
          }
          if (window.__backRedirect) window.__backRedirect(type, page);
        };
      })();
    </script>
    <script>
      // Back redirect: quem chegou na oferta e aperta "voltar" (na oferta ou saindo do checkout) vai para /desconto/.
      (function () {
        var KEY = 'sdi_back_redirect';
        function target() { return '/desconto/' + window.location.search; }
        function armed() { try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
        function arm() {
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          if (history.state && history.state.sdiTrap) return;
          try { history.pushState({ sdiTrap: true }, '', window.location.href); } catch (e) {}
        }
        window.__backRedirect = function (type, page) {
          if ((type === 'page_view' && page >= 28) || type === 'checkout_click') arm();
        };
        // Voltou do checkout da Greenn para o site: manda direto para o desconto.
        window.addEventListener('pageshow', function (ev) {
          var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
          if (armed() && (ev.persisted || nav.type === 'back_forward')) window.location.replace(target());
        });
        // Apertou "voltar" na pagina da oferta.
        window.addEventListener('popstate', function () {
          if (armed()) window.location.replace(target());
        });
      })();
    </script>
